  }

  function statusTone(status) { return STATUS_TONE[status] || 'neutral'; }
  function dealTone(status) { return DEAL_TONE[status] || 'neutral'; }

  function ageTone(days, opts) {
    opts = opts || {};
    var warnDays = opts.warnDays === undefined ? 7 : Number(opts.warnDays) || 0;
    var staleDays = opts.staleDays === undefined ? 14 : Number(opts.staleDays) || 0;

    if (days >= staleDays) return 'danger';
    if (days >= warnDays) return 'warn';
    return 'ok';
  }

  function fieldByKey(key) {
    for (var i = 0; i < FIELDS.length; i += 1) { if (FIELDS[i].key === key) return FIELDS[i]; }
    return null;
  }

  function fieldLabel(key) {
    var f = fieldByKey(key);
    return f ? f.label : key;
  }

  /** 邮箱格式校验（宽松：xx@yy.zz 即可，允许空值） */
  function isValidEmail(value) {
    var text = plainText(value);
    if (!text) return true;
    return /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(text);
  }

  /** 表单校验：返回 { ok, errors: { key: message } } */
  function validate(record) {
    var errors = {};
    var rec = record || {};
    if (!isValidISO(rec.firstInquiryAt)) errors.firstInquiryAt = '请选择首次询盘日期';
    if (!plainText(rec.customerName)) errors.customerName = '请填写客户名称';
    if (plainText(rec.customerName).length > 120) errors.customerName = '客户名称过长';
    if (!isValidEmail(rec.email)) errors.email = '邮箱格式不正确，例如 name@example.com';
    if (plainText(rec.phone).length > 60) errors.phone = '电话过长';
    if (plainText(rec.address).length > 500) errors.address = '地址过长';
    if (rec.followupStatus && FOLLOWUP_STATUS.indexOf(rec.followupStatus) === -1) errors.followupStatus = '跟进状态不合法';
    if (rec.dealStatus && DEAL_STATUS.indexOf(rec.dealStatus) === -1) errors.dealStatus = '成交状态不合法';
    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 7. 导出                                                             */
  /* ------------------------------------------------------------------ */

  return {
    VERSION: VERSION,
    STORAGE_KEY: STORAGE_KEY,
    FOLLOWUP_STATUS: FOLLOWUP_STATUS,
    DEAL_STATUS: DEAL_STATUS,
    STATUS_TONE: STATUS_TONE,
    DEAL_TONE: DEAL_TONE,
    COUNTRIES: COUNTRIES,
    FIELDS: FIELDS,
    FIELD_GROUPS: FIELD_GROUPS,
    FIELD_KEYS: FIELD_KEYS,
    DEFAULT_RECORD: DEFAULT_RECORD,
    DEFAULT_PRODUCTS: DEFAULT_PRODUCTS,

    emptyRecord: emptyRecord,
    normalize: normalize,
    derive: derive,
    validate: validate,
    isValidEmail: isValidEmail,
    fieldByKey: fieldByKey,
    fieldLabel: fieldLabel,

    todayISO: todayISO,
    nowISO: nowISO,
    isValidISO: isValidISO,
    addDays: addDays,
    daysBetween: daysBetween,
    parseLooseDate: parseLooseDate,
    formatShort: formatShort,
    formatDateTime: formatDateTime,
    uid: uid,

    findCountry: findCountry,
    countryByName: countryByName,
    countryFlag: countryFlag,
    flagFromISO: flagFromISO,
    countryOptions: countryOptions,

    statusTone: statusTone,
    dealTone: dealTone,
    ageTone: ageTone
  };
});

  var TEAM_RULES = [

      pick: function (m, text) {

        var value = cleanBusiness(m[1] + (BUSINESS_ROLE_MAP[m[2]] || ''));

        return { value: value, index: m.index, len: m[0].length };

    {
      /* English: specialized in / mainly deals in / distributor of / importer of / wholesaler of */
      id: 'business.en',
      re: /(?:speciali[sz](?:e|es|ed|ing)\s+in|mainly\s+(?:deals?|trades?)\s+in|deals?\s+mainly\s+in|distributor\s+of|importer\s+of|wholesaler\s+of|retailer\s+of|trading\s+company\s+(?:of|speciali[sz]ing\s+in)|imports?\s+and\s+distributes|focus(?:es|ed)?\s+on)\s+(?:the\s+)?([^.;,\n]{2,60})/gi,

        var value = cleanBusiness(m[1]);
        if (!value) { return null; }
        return { value: value, index: m.index, len: m[0].length };
      }
    }

  function extractMainBusiness(norm) {
    return pickFirstRule(BUSINESS_RULES, norm);
  }

  /* ---------- 7b.2 产品型号 productModel ---------- */

  /* 规格模式：容量 / 件套 / pcs / 尺寸 / 套装 */
  var MODEL_PATTERNS = [
    { id: 'model.capacity', re: /(\d+(?:\.\d+)?)\s*(ml|毫升|l|升)(?![\w])/gi },
    { id: 'model.count', re: /(\d+)\s*(件套|件套装|件装|pcs\.?|pieces?|pc|套)(?![\w])/gi },
    { id: 'model.set', re: /(\d+)\s*-\s*(?:pieces?|pcs?|pc)\s+set/gi },

  ];

  var MODEL_LABEL_RE = /(?:产品型号|型号|规格|model(?:\s*(?:no\.?|number))?|item\s*(?:no\.?|code)|sku|货号|款号)\s*[：:#]?\s*([A-Za-z0-9][A-Za-z0-9\-\/\.]{0,24})/gi;

  function normalizeModelToken(m, kind) {
    if (kind === 'model.capacity') {
      var unit = String(m[2]).toLowerCase();
      return String(m[1]) + (unit === 'ml' || unit === '毫升' ? 'ml' : 'L');
    }
    if (kind === 'model.count') {
      var u = String(m[2]).toLowerCase().replace(/\.$/, '');
      var n = String(m[1]);
      if (u === 'pcs' || u === 'pc' || u === 'piece' || u === 'pieces') { return n + ' pcs'; }
      if (u === '件套' || u === '件套装') { return n + ' 件套'; }
      if (u === '件装') { return n + ' 件装'; }
      return n + ' 套';
    }
    if (kind === 'model.set') { return String(m[1]) + '-piece set'; }
    if (kind === 'model.size') {
      var dimUnit = m[3] ? String(m[3]).toLowerCase() : '';
      if (dimUnit === '英寸') { dimUnit = 'inch'; }
      return String(m[1]) + '×' + String(m[2]) + dimUnit;
    }
    return '';
  }

  /** 从一段产品短语里收集规格 token（按出现顺序、去重） */
  function collectModelTokens(text) {
    if (!text) { return []; }
    var found = [];
    for (var p = 0; p < MODEL_PATTERNS.length; p += 1) {
      var def = MODEL_PATTERNS[p];
      def.re.lastIndex = 0;
      var m = def.re.exec(text);
      while (m !== null) {
        if (m[0].length === 0) { def.re.lastIndex += 1; m = def.re.exec(text); continue; }
        var token = normalizeModelToken(m, def.id);
        if (token) { found.push({ token: token, index: m.index }); }
        m = def.re.exec(text);
      }
    }
    found.sort(function (a, b) { return a.index - b.index; });
    var out = [];
    var seen = {};
    for (var i = 0; i < found.length; i += 1) {
      if (seen[found[i].token]) { continue; }
      seen[found[i].token] = 1;
      out.push(found[i]);
    }
    return out;
  }

  /** 在原文中定位型号的位置（evidence 用；空格/大小写做宽松匹配） */
  function locateModel(norm, token) {
    var idx = norm.indexOf(token);
    if (idx !== -1) { return { index: idx, len: token.length }; }
    var escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s*');
    var m = new RegExp(escaped, 'i').exec(norm);
    if (m) { return { index: m.index, len: m[0].length }; }
    return null;
  }

  /**
   * 产品型号：优先从已识别的产品短语中抽规格；
   * 抽不到时再看全文里「型号：XXX」这类显式标注；都没有则不输出。
   * productHit 为产品字段的匹配位置，用于 evidence 兜底。
   */
  function extractProductModel(norm, productText, productHit) {
    var tokens = collectModelTokens(productText);
    if (tokens.length) {
      var values = [];
      var total = 0;
      for (var i = 0; i < tokens.length && values.length < 3; i += 1) {
        var token = tokens[i].token;
        if (total + token.length + (values.length ? 1 : 0) > 30) { break; }
        values.push(token);
        total += token.length + 1;
      }
      if (values.length) {
        var found = locateModel(norm, values[0]);
        if (!found && productHit) { found = { index: productHit.index, len: productHit.len }; }
        if (found) {
          return { value: values.join(' '), index: found.index, len: found.len, rule: 'model.product' };
        }
      }
    }
    MODEL_LABEL_RE.lastIndex = 0;
    var m = MODEL_LABEL_RE.exec(norm);
    while (m !== null) {
      if (m[0].length === 0) { MODEL_LABEL_RE.lastIndex += 1; m = MODEL_LABEL_RE.exec(norm); continue; }
      var label = String(m[1] || '').replace(/[.\-_/]+$/, '');
      if (label.length >= 2 && /\d/.test(label)) {
        return { value: label, index: m.index + m[0].indexOf(m[1]), len: m[1].length, rule: 'model.label' };
      }
      m = MODEL_LABEL_RE.exec(norm);
    }
    return null;
  }

  /* ================================================================== */
  /* 7c. 联系方式：邮箱 / 电话 / 地址（v1.2 新增字段）                     */
  /* ================================================================== */

  /* ---------- 7c.1 邮箱 email ---------- */

  var EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9\-]*[A-Za-z0-9])?)+/g;

  /** 邮箱：取文中第一个合法邮箱（标签/裸邮箱都行），≤120 字 */
  function extractEmail(norm) {
    EMAIL_RE.lastIndex = 0;
    var m = EMAIL_RE.exec(norm);
    while (m !== null) {
      if (m[0].length === 0) { EMAIL_RE.lastIndex += 1; m = EMAIL_RE.exec(norm); continue; }
      var value = m[0].replace(/[.,;:]+$/, '');
      if (value.length >= 5 && value.length <= 120 && value.indexOf('@') > 0) {
        return { value: value, index: m.index, len: value.length, rule: 'email.email' };
      }
      m = EMAIL_RE.exec(norm);
    }
    return null;
  }

  /* ---------- 7c.2 电话 phone ---------- */

  var PHONE_RULES = [
    {
      /* 中文/英文标签之后的号码（Tel/Phone/Mobile/WhatsApp/传真/手机…） */
      id: 'phone.labeled',
      re: /(?:联系电话|联系方式|电话|手机号码|手机号|手机|座机|固话|传真|WhatsApp|Telegram|WeChat|微信|Tel|Phone|Mobile|Cell|Fax)\s*[：:.]?\s*(\+?(?:\(\s*\d{1,4}\s*\)\s*)?\d[\d\s\-().]{5,22}\d)/gi
    },
    { id: 'phone.intl', re: /(?:^|[^\d+])(\+\d[\d\s\-().]{5,22}\d)/g },
    { id: 'phone.intl00', re: /(?:^|[^\d])(00\d[\d\s\-().]{5,22}\d)/g },
    { id: 'phone.cn-mobile', re: /(?:^|[^\d])(1[3-9]\d{9})(?!\d)/g },
    { id: 'phone.grouped', re: /(?:^|[^\d])((?:\(\d{2,4}\)\s*)?\d{3,4}[\s\-]\d{3,4}(?:[\s\-]\d{2,4})?)(?!\d)/g }
  ];

  /** 明显的非电话语境：日期 / 金额 / 订单号 / 发票号 */
  function phoneContextRejected(norm, index, len) {
    var before = norm.slice(Math.max(0, index - 14), index);
    var after = norm.slice(index + len, Math.min(norm.length, index + len + 14));
    var around = (before + ' ' + after).toLowerCase();
    if (/(?:\bpo\b|订单|单号|合同号|发票|invoice|order\s*(?:no|#)|sku|编号|货号)/i.test(around)) { return true; }
    if (/(?:年|月|日|元|万|亿|美元|欧元|英镑|人民币|usd|eur|gbp|rmb|%|pcs|件套)/i.test(before.slice(-6) + ' ' + after.slice(0, 8))) { return true; }
    return false;
  }

  /** 校验并清洗电话候选：7-20 位数字，排除纯日期/金额/单号/邮箱内数字 */
  function phoneValueOf(candidate, norm, index, len, ruleId) {
    var raw = collapseSpace(candidate).replace(/^[\s\-]+/, '').replace(/[\s\-]+$/, '');
    raw = raw.replace(/[.,;:，。；：、]+$/, '');
    var digits = raw.replace(/\D/g, '');
    if (digits.length < 7 || digits.length > 20) { return null; }
    if (raw.length > 40) { return null; }
    /* 纯日期形态（2026-09-12）绝不当电话 */
    if (/^\d{4}\s*[-/.]\s*\d{1,2}\s*[-/.]\s*\d{1,2}$/.test(raw)) { return null; }
    /* 与邮箱/单词粘连的数字（如 13800138000@qq.com）不是电话 */
    var prev = index > 0 ? norm.charAt(index - 1) : '';
    var next = norm.charAt(index + len);
    if (/[A-Za-z0-9@._%+\-]/.test(prev) || /[A-Za-z0-9@]/.test(next)) { return null; }
    if (phoneContextRejected(norm, index, len)) { return null; }
    return { value: raw, index: index, len: len, rule: ruleId };
  }

  /** 电话：标签 > 国际区号 > 00 国际 > 中国手机 > 分组号码，保留原始格式（空白归一） */
  function extractPhone(norm) {
    for (var r = 0; r < PHONE_RULES.length; r += 1) {
      var rule = PHONE_RULES[r];
      var re = rule.re;
      re.lastIndex = 0;
      var m = re.exec(norm);
      while (m !== null) {
        if (m[0].length === 0) { re.lastIndex += 1; m = re.exec(norm); continue; }
        var candidate = m[1] || m[0];
        var index = m.index + m[0].indexOf(candidate);
        var hit = phoneValueOf(candidate, norm, index, candidate.length, rule.id);
        if (hit) { return hit; }
        m = re.exec(norm);
      }
    }
    return null;
  }

  /* ---------- 7c.3 地址 address ---------- */

  var ADDRESS_RULES = [
    {
      /* 公司/联系地址标签优先（允许英文地址里的逗号） */
      id: 'address.cn-strong',
      re: /(?:公司地址|办公地址|联系地址|通讯地址|注册地址|总部地址)\s*[：:]?\s*([^\n。；;]{2,200})/g
    },
    {
      /* 英文 Address / Add / Office / Headquarters 后的地址 */
      id: 'address.en',
      re: /(?:Address|Add\.?|Office|Headquarters|HQ)\s*(?:[:：]\s*|\n\s*)([^\n]{3,200})/gi
    },
    {
      /* 泛化中文地址标签（收货地址、地址等） */
      id: 'address.cn-label',
      re: /(?:收货地址|地址|住址|所在地)\s*[：:]?\s*([^\n。；;]{2,200})/g
    },
    {
      /* 公司位于 XXX */
      id: 'address.cn-located',
      re: /(?:公司|客户|他们|其|总部)?\s*(?:位于|坐落于|地处)\s*([^\n。；;]{2,200})/g
    },
    {
      /* 无标签的省市路号地址（如 浙江省宁波市鄞州区天童南路88号） */
      id: 'address.cn-standalone',
      re: /((?:[\u4e00-\u9fa5]{2,10}(?:省|自治区|特别行政区))?[\u4e00-\u9fa5]{2,10}市[\u4e00-\u9fa5]{2,12}(?:区|县)[\u4e00-\u9fa5A-Za-z0-9\s\-]{2,30}(?:路|街|大道|巷)[\u4e00-\u9fa5A-Za-z0-9\s\-]{1,20}(?:号|弄|栋|楼|室)?)/g

  /* 「邮箱地址」「IP 地址」「网址」里的「地址」不是通讯地址 */
  var ADDRESS_NOISE_RE = /(?:邮箱|email|e-mail|ip|网址|网站|网页|链接|服务器|二维码)/i;

  function addressNoise(norm, index) {
    var before = norm.slice(Math.max(0, index - 10), index);
    return ADDRESS_NOISE_RE.test(before);
  }

  /** 清洗地址：去标签残留、去后面混入的说明句、≤200 字 */
  function cleanAddress(value) {
    var t = collapseSpace(value);
    t = t.replace(/^[\s:：,，;；\-–—]+/, '');
    /* 中文地址后常跟「，请…/，电话…」等说明，从这些词处截断 */
    t = t.split(/[，,]\s*(?=(?:请|谢谢|感谢|联系|电话|手机|邮箱|email|e-mail|传真|邮编|我们|本公司|欢迎|期待|如有|需要|发货|收货|成立于|成立|主营|规模|员工|团队|年营|主要))/i)[0];
    /* 英文地址可能把后面的客套话一起吞进来，按常见句首截断 */
    t = t.split(/\s+(?:Please|Kindly|Best\s+regards|Thanks|Thank\s+you|Regards|Sincerely|We\s+look|Looking\s+forward|Our\s+company)\b/i)[0];
    t = t.replace(/[\s,，;；。.]+$/, '');
    if (!t || t.length < 4) { return ''; }
    if (t.length > 200) { t = t.slice(0, 200); }
    return t;
  }

  /** 地址：公司/联系地址优先，其次其他标签，最后「位于」与无标签省市路号 */
  function extractAddress(norm) {
    for (var r = 0; r < ADDRESS_RULES.length; r += 1) {
      var rule = ADDRESS_RULES[r];
      var re = rule.re;
      re.lastIndex = 0;
      var m = re.exec(norm);
      while (m !== null) {
        if (m[0].length === 0) { re.lastIndex += 1; m = re.exec(norm); continue; }
        if (addressNoise(norm, m.index)) {
          m = re.exec(norm);
          continue;
        }
        var raw = m[1] || m[0];
        var value = cleanAddress(raw);
        if (value) {
          var index = m.index + m[0].indexOf(raw);
          return { value: value, index: index, len: raw.length, rule: rule.id };
        }
        m = re.exec(norm);
      }
    }
    return null;
  }

  /* ================================================================== */
  /* 8. 跟进状态 / 成交状态                                               */
  /* ================================================================== */

  var STATUS_RULES = [
    {
      /* 已成交 / 下单 / 签约 / PO → 已成交（最高优先级） */
      id: 'status.deal',
      re: /成交|下单|签约|签合同|签订|已付定金|已付款|打款|placed\s+(?:an?\s+)?order|order\s+(?:placed|confirmed)|deal\s+(?:was\s+|is\s+)?(?:closed|won)|closed\s+(?:the\s+)?deal|signed\s+(?:the\s+)?(?:contract|order|p\.?o\.?)|won\s+the\s+deal|\bP\.?O\.?\b/gi,

    },
    {
      /* 报价 / quotation → 已报价 */
      id: 'status.quote',

      re: /寄样|样品|样册|样板|打样|寄出样|\bsamples?\b|sent\s+(?:the\s+)?samples?|catalog(?:ue)?/gi,

    },
    {

      re: /谈判|磋商|协商|合同条款|合同细节|contract\s+terms|negotiat/gi,

    },

      id: 'status.lost',

      pick: function (m) { return { value: '已流失', index: m.index, len: m[0].length }; }
    },
    {

      id: 'status.pause',
      re: /暂停|搁置|暂缓|暂不|on\s+hold|hold\s+off|put\s+on\s+hold/gi,

    },
    {

      id: 'status.replied',

    }

  /* 成交状态判断用非全局正则（只需第一次匹配，避免 lastIndex 跨调用污染） */
  var DEAL_NEG_RE = /未成交|尚未成交|还没成交|没有成交|未下单|还没下单|没有下单|未签约|未达成|not\s+(?:yet\s+)?closed|hasn'?t\s+(?:been\s+)?closed|haven'?t\s+(?:been\s+)?closed|isn'?t\s+closed|no\s+deal|not\s+a\s+(?:closed\s+)?deal|no\s+order|didn'?t\s+order|not\s+ordered\s+yet|待成交/i;
  var DEAL_POS_RE = /成交|下单|签约|签订|已付定金|已付款|placed\s+(?:an?\s+)?order|order\s+(?:placed|confirmed)|deal\s+(?:was\s+|is\s+)?(?:closed|won)|closed\s+(?:the\s+)?deal|signed\s+(?:the\s+)?(?:contract|order|po)|won\s+the\s+deal|\bpo\s+(?:issued|received)\b/i;
  var DEAL_PENDING_RE = /仍在等|还在等|等待|待确认|等确认|pending|awaiting|waiting\s+for|to\s+be\s+confirmed|comparing|比较供应商/i;

  /**
   * 成交状态：明确成交 → 已成交；明确未成交/待确认 → 未成交；
   * 已经有报价/寄样/谈判等进度但无成交词时视为未成交（契约样例 A 即此情况）。
   */
  function extractDealStatus(norm, statusValue) {
    var m = DEAL_NEG_RE.exec(norm);
    if (m) { return { value: '未成交', index: m.index, len: m[0].length, rule: 'deal.negative' }; }
    m = DEAL_POS_RE.exec(norm);
    if (m) { return { value: '已成交', index: m.index, len: m[0].length, rule: 'deal.positive' }; }
    m = DEAL_PENDING_RE.exec(norm);
    if (m) { return { value: '未成交', index: m.index, len: m[0].length, rule: 'deal.pending' }; }

    return null;
  }

  /* ================================================================== */
  /* 9. 核心原因                                                         */
  /* ================================================================== */

  var REASON_SUBJECTS = [
    { re: /价格|价位|单价|报价|price|pricing/i, w: 2 },
    { re: /目标价|target\s*price|budget|\btarget\b|心理价/i, w: 1 },
    { re: /交期|交货|货期|lead\s*time|delivery/i, w: 2 },
    { re: /付款|支付|账期|定金|deposit|payment|prepay/i, w: 2 },
    { re: /质量|品质|quality/i, w: 2 },
    { re: /认证|证书|certif/i, w: 2 },
    { re: /运费|物流|freight|shipping|logistics/i, w: 2 },
    { re: /竞争|对手|其他供应商|competitor|alternative|comparing/i, w: 2 },
    { re: /起订量|moq|数量|quantity/i, w: 1 },
    { re: /折扣|discount/i, w: 1 },
    { re: /成本|cost|expensive|too\s+high/i, w: 1 }
  ];

  var REASON_CUES = [
    { re: /原因|因为|由于|主要是|卡在|顾虑|担心|反馈|问题在于|争议|原因在于/i, w: 1 },
    { re: /太长|太慢|太高|太低|太贵|太远|不满意|不接受|再考虑|考虑一下|观望|比较过|comparing/i, w: 1 },
    { re: /because|due\s+to|reason|concern|issue|problem|worried|however|said|mentioned/i, w: 1 }
  ];

  /**
   * 原因句打分：至少要「命中 2 类关键词」或「有明确原因语气词且总分 ≥3」才算数，

      var revenue = pickFirstRule(REVENUE_RULES, norm);

      }

      var email = extractEmail(norm);
      if (email) { setField(ctx, 'email', email.value, email.index, email.len, email.rule); }
      var phone = extractPhone(norm);
      if (phone) { setField(ctx, 'phone', phone.value, phone.index, phone.len, phone.rule); }
      var address = extractAddress(norm);
      if (address) { setField(ctx, 'address', address.value, address.index, address.len, address.rule); }

      /* 9) 跟进状态：识别不到则按契约给默认「新询盘」 */
      var status = pickFirstRule(STATUS_RULES, norm);
      var statusValue = status ? status.value : '新询盘';

      } else {
        ctx.fields.followupStatus = statusValue;

        ctx.evidence.followupStatus = { value: statusValue, snippet: makeSnippet(body, 0, 0) };
      }

      /* 10) 成交状态 */
      var deal = extractDealStatus(norm, statusValue);
      if (deal) { setField(ctx, 'dealStatus', deal.value, deal.index, deal.len, deal.rule); }

      /* 11) 核心原因 */
      var reason = extractCoreReason(norm);
      if (reason) { setField(ctx, 'coreReason', reason.value, reason.index, reason.len, reason.rule); }

      /* 12) 跟进记录（最新在前，最多 3 条） */
      out.followups = buildFollowups(norm, body, dates, inquiry ? inquiry.iso : '');

      /* 13) 汇总 */
      out.fields = ctx.fields;
      out.evidence = ctx.evidence;
      out.filled = Object.keys(ctx.fields).length;
      out.missing = FIELD_KEYS.filter(function (k) { return !ctx.fields[k]; });
      out.ok = out.filled > 0;
      out.raw.matchedRules = ctx.rules.slice();
      if (truncated) {
        out.warnings.push({ code: 'truncated', message: '文本过长，仅识别前 20 万字' });
      }
      return out;
    } catch (err) {
      /* 契约要求绝不抛异常：兜底返回可用的空结果 + 警告 */
      out.warnings.push({ code: 'internal', message: '识别过程出现异常，请手动核对结果' });
      return out;
    }
  }

  /**
   * 单字段日期识别（便于单测）：返回文本中最靠前的一个完整日期。
   */
  function parseDate(text, opts) {
    try {
      var input = (text === null || text === undefined) ? '' : String(text);

      var dates = collectDates(norm, resolveFallbackYear(opts));
      return dates.length ? dates[0].iso : '';
    } catch (err) {

    }
  }

  /* 11. 导出                                                             */
  /* ================================================================== */

  return {
    VERSION: VERSION,
    recognize: recognize,
    parseDate: parseDate,
    SAMPLE_TEXTS: SAMPLE_TEXTS
  };
});

    this.nextNumFmtId = CUSTOM_NUMFMT_START;
    this.bodyIndex = this.addXf({
      fontId: 0, fillId: 0, borderId: 1, numFmtId: 0,
      align: 'left', wrap: false, vertical: 'center'
    }, 'body|left|0|0');
    this.headerIndex = this.addXf({
      fontId: 1, fillId: 2, borderId: 1, numFmtId: 0,
      align: 'center', wrap: false, vertical: 'center'
    }, 'header');
  }

  StyleBook.prototype.addXf = function (xf, key) {
    if (key && Object.prototype.hasOwnProperty.call(this.xfMap, key)) { return this.xfMap[key]; }
    var index = this.xfs.length;
    this.xfs.push(xf);
    if (key) { this.xfMap[key] = index; }
    return index;
  };

  StyleBook.prototype.resolveNumFmt = function (code) {
    if (code === null || code === undefined || code === '') { return 0; }
    var key = String(code);
    if (Object.prototype.hasOwnProperty.call(BUILTIN_NUMFMT, key)) { return BUILTIN_NUMFMT[key]; }
    if (Object.prototype.hasOwnProperty.call(this.numFmtMap, key)) { return this.numFmtMap[key]; }
    var id = this.nextNumFmtId;
    this.nextNumFmtId += 1;
    this.numFmtMap[key] = id;
    this.numFmts.push({ id: id, code: key });
    return id;
  };

  StyleBook.prototype.bodyStyle = function (align, wrap, numFmt) {
    var a = align === 'center' || align === 'right' ? align : 'left';
    var w = wrap ? 1 : 0;
    var numFmtId = this.resolveNumFmt(numFmt);
    var key = 'body|' + a + '|' + w + '|' + numFmtId;
    if (Object.prototype.hasOwnProperty.call(this.xfMap, key)) { return this.xfMap[key]; }
    return this.addXf({
      fontId: 0, fillId: 0, borderId: 1, numFmtId: numFmtId,
      align: a, wrap: w === 1, vertical: 'center'
    }, key);
  };

  StyleBook.prototype.toXml = function () {
    var xml = [XML_DECL, '<styleSheet xmlns="', NS_MAIN, '">'];

    if (this.numFmts.length) {
      xml.push('<numFmts count="', String(this.numFmts.length), '">');
      this.numFmts.forEach(function (fmt) {
        xml.push('<numFmt numFmtId="', String(fmt.id), '" formatCode="', xmlEscape(fmt.code), '"/>');
      });
      xml.push('</numFmts>');
    }

    /* 字体：0 正文；1 表头（加粗、白色） */
    xml.push('<fonts count="2">');
    xml.push('<font><sz val="11"/><color rgb="FF1F2933"/><name val="微软雅黑"/><family val="2"/></font>');
    xml.push('<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="微软雅黑"/><family val="2"/></font>');
    xml.push('</fonts>');

    /* 填充：0 none（必须）、1 gray125（必须）、2 表头深蓝 */
    xml.push('<fills count="3">');
    xml.push('<fill><patternFill patternType="none"/></fill>');
    xml.push('<fill><patternFill patternType="gray125"/></fill>');
    xml.push('<fill><patternFill patternType="solid"><fgColor rgb="', HEADER_FILL_COLOR,
      '"/><bgColor indexed="64"/></patternFill></fill>');
    xml.push('</fills>');

    /* 边框：0 无边框；1 浅灰细边框 */
    var gridSides = '<left style="thin"><color rgb="FFD8DEE6"/></left>' +
      '<right style="thin"><color rgb="FFD8DEE6"/></right>' +
      '<top style="thin"><color rgb="FFD8DEE6"/></top>' +
      '<bottom style="thin"><color rgb="FFD8DEE6"/></bottom>' +
      '<diagonal/>';
    xml.push('<borders count="2">');
    xml.push('<border><left/><right/><top/><bottom/><diagonal/></border>');
    xml.push('<border>', gridSides, '</border>');
    xml.push('</borders>');

    xml.push('<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>');

    xml.push('<cellXfs count="', String(this.xfs.length), '">');
    this.xfs.forEach(function (xf) {
      xml.push('<xf numFmtId="', String(xf.numFmtId),
        '" fontId="', String(xf.fontId),
        '" fillId="', String(xf.fillId),
        '" borderId="', String(xf.borderId),
        '" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"',
        xf.fillId ? ' applyFill="1"' : '',
        xf.numFmtId ? ' applyNumberFormat="1"' : '',
        '><alignment horizontal="', xf.align,
        '" vertical="', (xf.vertical || 'center'),
        '"', xf.wrap ? ' wrapText="1"' : '', '/></xf>');
    });
    xml.push('</cellXfs>');

    xml.push('<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>');
    xml.push('<tableStyles count="0" defaultTableStyle="TableStyleMedium2" defaultPivotStyle="PivotStyleLight16"/>');
    xml.push('</styleSheet>');
    return xml.join('');
  };

  /* ================================================================== */
  /* 4. 单元格 / 工作表 XML                                               */
  /* ================================================================== */

  function formatNumber(value) {
    if (!isFinite(value)) { return '0'; }
    if (Number.isInteger(value)) { return String(value); }
    var text = String(value);
    if (/[eE]/.test(text)) {
      text = value.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
    }
    return text;
  }

  function textCellXml(ref, styleIndex, text) {
    var escaped = xmlEscape(text);
    if (!escaped) { return ''; }
    return '<c r="' + ref + '" s="' + styleIndex + '" t="inlineStr"><is><t xml:space="preserve">' +
      escaped + '</t></is></c>';
  }

  function numberCellXml(ref, styleIndex, value) {
    return '<c r="' + ref + '" s="' + styleIndex + '"><v>' + formatNumber(value) + '</v></c>';
  }

  function formatDateOnly(date) {
    var d = date instanceof Date ? date : new Date(date);
    if (isNaN(d.getTime())) { return ''; }
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function pad2(n) {
    n = Number(n) || 0;
    return n < 10 ? '0' + n : String(n);
  }

  function normalizeAlign(align) {
    return align === 'center' || align === 'right' ? align : 'left';
  }

  function sanitizeSheetName(name, fallback) {
    var text = name === null || name === undefined ? '' : String(name);
    text = text.replace(/[[\]:*?\/\\]/g, ' ').replace(/\s+/g, ' ').trim();
    text = text.replace(/^'+|'+$/g, '').trim();
    if (!text) { text = fallback || 'Sheet'; }
    if (text.length > MAX_SHEET_NAME) { text = text.slice(0, MAX_SHEET_NAME); }
    return text;
  }

  function uniqueSheetName(name, used) {
    var candidate = name;
    var suffix = 2;
    while (used[candidate]) {
      var tail = ' (' + suffix + ')';
      candidate = name.slice(0, Math.max(1, MAX_SHEET_NAME - tail.length)) + tail;
      suffix += 1;
    }
    return candidate;
  }

  /**
   * 生成单个 worksheet 的 XML。返回 { name, xml }。
   * sheets[i]: { name, columns:[{header,width,numFmt,align,wrap}], rows:[[cell]], freeze:{rows,cols}, autoFilter }
   */
  function buildSheetXml(sheet, styles, index) {
    sheet = sheet && typeof sheet === 'object' ? sheet : {};
    var columns = Array.isArray(sheet.columns) ? sheet.columns : [];
    var rows = Array.isArray(sheet.rows) ? sheet.rows : [];

    var colCount = columns.length;
    var r;
    for (r = 0; r < rows.length; r += 1) {
      if (Array.isArray(rows[r]) && rows[r].length > colCount) { colCount = rows[r].length; }
    }

    var name = sanitizeSheetName(sheet.name, 'Sheet' + (index + 1));

    /* 4.1 列定义（默认宽度 12，限制 2~255） */
    var colDefs = [];
    var colsXml = '';
    if (colCount > 0) {
      var cols = ['<cols>'];
      var c;
      for (c = 0; c < colCount; c += 1) {
        var col = columns[c] || {};
        var width = Number(col.width);
        if (!isFinite(width) || width <= 0) { width = 12; }
        width = Math.min(255, Math.max(2, Math.round(width * 10) / 10));
        colDefs.push({
          width: width,
          align: normalizeAlign(col.align),
          wrap: !!col.wrap,
          numFmt: col.numFmt
        });
        cols.push('<col min="', String(c + 1), '" max="', String(c + 1),
          '" width="', String(width), '" customWidth="1"/>');
      }
      cols.push('</cols>');
      colsXml = cols.join('');
    }

    /* 4.2 表头行（深蓝底白字、行高 24、居中） */
    var headerCells = '';
    for (var hc = 0; hc < colCount; hc += 1) {
      var headerText = columns[hc] && columns[hc].header !== null && columns[hc].header !== undefined
        ? String(columns[hc].header) : '';
      if (!headerText) { continue; }
      headerCells += textCellXml(cellRef(hc, 1), styles.headerIndex, headerText);
    }
    var headerRowXml = '<row r="1" ht="24" customHeight="1">' + headerCells + '</row>';

    /* 4.3 数据行 */
    var rowXmlList = [];
    for (r = 0; r < rows.length; r += 1) {
      var row = Array.isArray(rows[r]) ? rows[r] : [];
      var cells = ['<row r="', String(r + 2), '">'];
      var hasCell = false;
      for (var ci = 0; ci < colCount; ci += 1) {
        var value = row[ci];
        if (value === null || value === undefined || value === '') { continue; }
        var def = colDefs[ci];
        var ref = cellRef(ci, r + 2);
        var cellXml;
        if (typeof value === 'number') {
          if (!isFinite(value)) { continue; }
          cellXml = numberCellXml(ref, styles.bodyStyle(def.align, false, def.numFmt), value);
        } else if (typeof value === 'boolean') {
          cellXml = textCellXml(ref, styles.bodyStyle(def.align, def.wrap, def.numFmt), value ? '是' : '否');
        } else if (value instanceof Date) {
          var dateText = formatDateOnly(value);
          cellXml = dateText ? textCellXml(ref, styles.bodyStyle(def.align, def.wrap, def.numFmt), dateText) : '';
        } else if (typeof value === 'object') {
          var jsonText = '';
          try { jsonText = JSON.stringify(value); } catch (e) { jsonText = ''; }
          cellXml = jsonText ? textCellXml(ref, styles.bodyStyle(def.align, def.wrap, def.numFmt), jsonText) : '';
        } else {
          cellXml = textCellXml(ref, styles.bodyStyle(def.align, def.wrap, def.numFmt), String(value));
        }
        if (cellXml) {
          cells.push(cellXml);
          hasCell = true;
        }
      }
      cells.push('</row>');
      if (hasCell || colCount === 0) { rowXmlList.push(cells.join('')); }
      else { rowXmlList.push('<row r="' + (r + 2) + '"></row>'); }
    }

    /* 4.4 冻结窗格 */
    var freeze = sheet.freeze && typeof sheet.freeze === 'object' ? sheet.freeze : {};
    var freezeRows = Math.max(0, Math.min(1048575, Math.floor(Number(freeze.rows) || 0)));
    var freezeCols = Math.max(0, Math.min(16383, Math.floor(Number(freeze.cols) || 0)));
    var viewParts = ['<sheetView workbookViewId="0"'];
    if (index === 0) { viewParts.push(' tabSelected="1"'); }
    viewParts.push('>');
    if (freezeRows > 0 || freezeCols > 0) {
      var topLeft = colLetter(freezeCols) + String(freezeRows + 1);
      var activePane = freezeRows > 0 && freezeCols > 0 ? 'bottomRight'
        : (freezeRows > 0 ? 'bottomLeft' : 'topRight');
      viewParts.push('<pane');
      if (freezeCols > 0) { viewParts.push(' xSplit="', String(freezeCols), '"'); }
      if (freezeRows > 0) { viewParts.push(' ySplit="', String(freezeRows), '"'); }
      viewParts.push(' topLeftCell="', topLeft, '" activePane="', activePane, '" state="frozen"/>');
      viewParts.push('<selection pane="', activePane, '" activeCell="', topLeft,
        '" sqref="', topLeft, '"/>');
    } else {
      viewParts.push('<selection activeCell="A1" sqref="A1"/>');
    }
    viewParts.push('</sheetView>');
    var sheetViewsXml = '<sheetViews>' + viewParts.join('') + '</sheetViews>';

    /* 4.5 尺寸 / 自动筛选 */
    var lastRow = rows.length + 1;
    var lastColLetter = colLetter(Math.max(0, colCount - 1));
    var dimension = colCount > 0 ? 'A1:' + lastColLetter + lastRow : 'A1';
    var autoFilterXml = '';
    if (sheet.autoFilter && colCount > 0) {
      autoFilterXml = '<autoFilter ref="A1:' + lastColLetter + lastRow + '"/>';
    }

    var xml = XML_DECL + '<worksheet xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '">' +
      '<dimension ref="' + dimension + '"/>' +
      sheetViewsXml +
      '<sheetFormatPr defaultRowHeight="18" baseColWidth="10"/>' +
      colsXml +
      '<sheetData>' + headerRowXml + rowXmlList.join('') + '</sheetData>' +
      autoFilterXml +
      '</worksheet>';

    return { name: name, xml: xml };
  }

  /* ================================================================== */
  /* 5. 工作簿打包                                                       */
  /* ================================================================== */

  function contentTypesXml(sheetCount) {
    var xml = [XML_DECL, '<Types xmlns="', NS_CONTENT, '">'];
    xml.push('<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>');
    xml.push('<Default Extension="xml" ContentType="application/xml"/>');
    xml.push('<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>');
    for (var i = 1; i <= sheetCount; i += 1) {
      xml.push('<Override PartName="/xl/worksheets/sheet', String(i),
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    }
    xml.push('<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>');
    xml.push('<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>');
    xml.push('</Types>');
    return xml.join('');
  }

  function rootRelsXml() {
    return XML_DECL + '<Relationships xmlns="' + NS_PKG_REL + '">' +
      '<Relationship Id="rId1" Type="' + NS_REL + '/officeDocument" Target="xl/workbook.xml"/>' +
      '<Relationship Id="rId2" Type="' + NS_PKG_REL + '/metadata/core-properties" Target="docProps/core.xml"/>' +
      '</Relationships>';
  }

  function workbookXml(sheetFiles) {
    var parts = [XML_DECL, '<workbook xmlns="', NS_MAIN, '" xmlns:r="', NS_REL, '">'];
    parts.push('<bookViews><workbookView xWindow="0" yWindow="0" windowWidth="28800" windowHeight="14400" activeTab="0"/></bookViews>');
    parts.push('<sheets>');
    for (var i = 0; i < sheetFiles.length; i += 1) {
      parts.push('<sheet name="', xmlEscape(sheetFiles[i].name), '" sheetId="', String(i + 1),
        '" r:id="rId', String(i + 1), '"/>');
    }
    parts.push('</sheets>');
    parts.push('</workbook>');
    return parts.join('');
  }

  function workbookRelsXml(sheetCount) {
    var parts = [XML_DECL, '<Relationships xmlns="', NS_PKG_REL, '">'];
    for (var i = 1; i <= sheetCount; i += 1) {
      parts.push('<Relationship Id="rId', String(i), '" Type="', NS_REL,
        '/worksheet" Target="worksheets/sheet', String(i), '.xml"/>');
    }
    parts.push('<Relationship Id="rId', String(sheetCount + 1), '" Type="', NS_REL,
      '/styles" Target="styles.xml"/>');
    parts.push('</Relationships>');
    return parts.join('');
  }

  function corePropsXml(title) {
    var now = new Date().toISOString();
    var docTitle = title && String(title).trim() ? String(title).trim() : '客户跟进台账';
    return XML_DECL + '<cp:coreProperties xmlns:cp="' + NS_CP + '" xmlns:dc="' + NS_DC +
      '" xmlns:dcterms="' + NS_DCTERMS + '" xmlns:dcmitype="' + NS_DCMITYPE +
      '" xmlns:xsi="' + NS_XSI + '">' +
      '<dc:title>' + xmlEscape(docTitle) + '</dc:title>' +
      '<dc:creator>客户通 CustomerCRM</dc:creator>' +
      '<cp:lastModifiedBy>客户通 CustomerCRM</cp:lastModifiedBy>' +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + now + '</dcterms:modified>' +
      '</cp:coreProperties>';
  }

  /**
   * 组装并打包 .xlsx。
   * @param {Array} sheets 工作表定义数组
   * @param {Object} [options] { title } 文档属性标题
   * @returns {Uint8Array}
   */
  function buildWorkbook(sheets, options) {
    var list = Array.isArray(sheets) ? sheets : [];
    if (!list.length) {
      list = [{ name: 'Sheet1', columns: [], rows: [] }];
    }
    var styles = new StyleBook();
    var usedNames = Object.create(null);
    var sheetFiles = [];

    for (var i = 0; i < list.length; i += 1) {
      var built = buildSheetXml(list[i], styles, i);
      var name = uniqueSheetName(built.name, usedNames);
      usedNames[name] = true;
      sheetFiles.push({ name: name, xml: built.xml });
    }

    var parts = [];
    parts.push({ name: '[Content_Types].xml', xml: contentTypesXml(sheetFiles.length) });
    parts.push({ name: '_rels/.rels', xml: rootRelsXml() });
    parts.push({ name: 'docProps/core.xml', xml: corePropsXml(options && options.title) });
    parts.push({ name: 'xl/workbook.xml', xml: workbookXml(sheetFiles) });
    parts.push({ name: 'xl/_rels/workbook.xml.rels', xml: workbookRelsXml(sheetFiles.length) });
    for (var s = 0; s < sheetFiles.length; s += 1) {
      parts.push({ name: 'xl/worksheets/sheet' + (s + 1) + '.xml', xml: sheetFiles[s].xml });
    }
    parts.push({ name: 'xl/styles.xml', xml: styles.toXml() });

    var zip = new ZipWriter();
    for (var p = 0; p < parts.length; p += 1) {
      zip.add(parts[p].name, utf8Encode(parts[p].xml));
    }
    return zip.finish();
  }

  /* 6. 客户台账导出：两个工作表、24 + 13 列（v1.2）                       */
  /* ================================================================== */

  /* v1.2：客户总表 24 列（客户名称后新增「邮箱」「电话」「地址」） */
  var TOTAL_COLUMNS = [
    { header: '序号', width: 8, align: 'center' },
    { header: '首次询盘时间', width: 15, align: 'center' },
    { header: '客户名称', width: 20 },

    { header: '地址', width: 34 },
    { header: '咨询产品', width: 26 },
    { header: '产品型号', width: 16 },
    { header: '国家', width: 14, align: 'center' },
    { header: '公司名', width: 30 },
    { header: '主营业务', width: 22 },
    { header: '成立时间', width: 14, align: 'center' },
    { header: '团队规模', width: 16 },
    { header: '年营收', width: 18 },
    { header: '跟进状态', width: 14, align: 'center' },
    { header: '是否成交', width: 12, align: 'center' },

    { header: '距上次跟进(天)', width: 17, align: 'center', numFmt: '0' },

    { header: '最近跟进②日期', width: 16, align: 'center' },
    { header: '最近跟进②内容', width: 46, wrap: true },
    { header: '最近跟进③日期', width: 16, align: 'center' },

  ];

  /* v1.2：跟进明细 13 列（客户名称后新增「邮箱」「电话」） */
  var DETAIL_COLUMNS = [
    { header: '序号', width: 8, align: 'center' },
    { header: '首次询盘时间', width: 15, align: 'center' },
    { header: '客户名称', width: 20 },
    { header: '邮箱', width: 26 },
    { header: '电话', width: 20 },

    { header: '国家', width: 14, align: 'center' },
    { header: '跟进日期', width: 15, align: 'center' },
    { header: '距今天数', width: 12, align: 'center', numFmt: '0' },
    { header: '跟进内容', width: 60, wrap: true },
    { header: '跟进状态', width: 14, align: 'center' },
    { header: '是否成交', width: 12, align: 'center' }
  ];

  function pad2Local(n) {
    n = Number(n) || 0;
    return n < 10 ? '0' + n : String(n);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2Local(d.getMonth() + 1) + '-' + pad2Local(d.getDate());
  }

  function nowStamp() {
    var d = new Date();
    return String(d.getFullYear()) + pad2Local(d.getMonth() + 1) + pad2Local(d.getDate()) +
      '_' + pad2Local(d.getHours()) + pad2Local(d.getMinutes());
  }

  function isValidISODate(iso) {
    if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) { return false; }
    var parts = iso.split('-');
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    var d = Number(parts[2]);
    var dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }

  function daysBetweenISO(fromISO, toISODate) {
    var a = Date.parse(fromISO + 'T00:00:00Z');
    var b = Date.parse(toISODate + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b)) { return 0; }
    return Math.round((b - a) / 86400000);
  }

  function asText(value) {
    if (value === null || value === undefined) { return ''; }
    if (typeof value === 'number') { return String(value); }
    if (typeof value === 'boolean') { return value ? '是' : '否'; }
    return String(value);
  }

  /** 内置跟进清洗：解析日期、倒序、去重、最多 3 条（schema 不可用时的兜底）。 */
  function normalizeFollowupsFallback(list) {
    var out = [];
    if (Array.isArray(list)) {
      list.forEach(function (item) {
        if (!item || typeof item !== 'object') { return; }
        var date = asText(item.date);
        if (!isValidISODate(date)) { return; }
        var note = asText(item.note || item.text || item.content).slice(0, 300);
        out.push({ date: date, note: note });
      });
    }
    out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    var seen = {};
    var dedup = [];
    out.forEach(function (item) {
      var key = item.date + '|' + item.note;
      if (seen[key]) { return; }
      seen[key] = true;
      dedup.push(item);
    });
    return dedup.slice(0, 3);
  }

  /** 内置派生（schema.derive 不可用时的兜底），字段与 schema.derive 对齐。 */
  function deriveFallback(record, today) {
    var rec = record && typeof record === 'object' ? record : {};
    var followups = normalizeFollowupsFallback(rec.followups);
    var last3 = followups.map(function (item) {
      return { date: item.date, note: item.note, daysAgo: Math.max(0, daysBetweenISO(item.date, today)) };
    });
    var last = last3.length ? last3[0] : null;
    return {
      firstInquiryAt: asText(rec.firstInquiryAt),
      customerName: asText(rec.customerName),
      email: asText(rec.email),
      phone: asText(rec.phone),
      address: asText(rec.address),
      product: asText(rec.product),
      productModel: asText(rec.productModel),
      country: asText(rec.country),
      companyName: asText(rec.companyName),
      mainBusiness: asText(rec.mainBusiness),
      foundedAt: asText(rec.foundedAt),
      teamSize: asText(rec.teamSize),
      annualRevenue: asText(rec.annualRevenue),
      followupStatus: asText(rec.followupStatus) || '新询盘',
      dealStatus: asText(rec.dealStatus) || '未成交',
      coreReason: asText(rec.coreReason),
      followups: followups,
      last3: last3,
      lastFollowupAt: last ? last.date : '',
      daysSince: last ? last.daysAgo : null
    };
  }

  /** 记录已带派生字段（last3 / daysSince）但没有 followups 时的兜底组装。 */
  function deriveFromPrecomputed(record, today) {
    var rec = record && typeof record === 'object' ? record : {};
    var last3 = [];
    var list = Array.isArray(rec.last3) ? rec.last3 : [];
    list.forEach(function (item) {
      if (!item || typeof item !== 'object') { return; }
      var date = asText(item.date);
      if (!isValidISODate(date)) { return; }
      var daysAgo = item.daysAgo === null || item.daysAgo === undefined
        ? Math.max(0, daysBetweenISO(date, today))
        : Math.max(0, Number(item.daysAgo) || 0);
      last3.push({ date: date, note: asText(item.note).slice(0, 300), daysAgo: daysAgo });
    });
    last3 = last3.slice(0, 3);
    var daysSince = rec.daysSince === null || rec.daysSince === undefined
      ? (last3.length ? last3[0].daysAgo : null)
      : Math.max(0, Number(rec.daysSince) || 0);
    return {
      firstInquiryAt: asText(rec.firstInquiryAt),
      customerName: asText(rec.customerName),
      email: asText(rec.email),
      phone: asText(rec.phone),
      address: asText(rec.address),
      product: asText(rec.product),
      productModel: asText(rec.productModel),
      country: asText(rec.country),
      companyName: asText(rec.companyName),
      mainBusiness: asText(rec.mainBusiness),
      foundedAt: asText(rec.foundedAt),
      teamSize: asText(rec.teamSize),
      annualRevenue: asText(rec.annualRevenue),
      followupStatus: asText(rec.followupStatus) || '新询盘',
      dealStatus: asText(rec.dealStatus) || '未成交',
      coreReason: asText(rec.coreReason),
      followups: last3,
      last3: last3,
      lastFollowupAt: last3.length ? last3[0].date : '',
      daysSince: daysSince
    };
  }

  /**
   * 优先使用 schema.derive（与界面口径一致）；异常时退回内置实现。
   * 兼容两种入参：原始记录（11 字段 + followups）与已带派生字段的记录（last3/daysSince）。
   */
  function deriveRecord(record, today, schema) {
    var rec = record && typeof record === 'object' ? record : {};
    /* 已派生但没有 followups 的记录：直接沿用派生好的最近跟进，不丢信息 */
    if (!Array.isArray(rec.followups) && Array.isArray(rec.last3)) {
      return deriveFromPrecomputed(rec, today);
    }
    if (schema && typeof schema.derive === 'function') {
      try {
        var derived = schema.derive(rec, { today: today });
        if (derived && Array.isArray(derived.last3)) {
          if (derived.daysSince === undefined) { derived.daysSince = null; }
          if (!Array.isArray(derived.followups)) { derived.followups = []; }
          return derived;
        }
      } catch (err) { /* 回退到内置派生 */ }
    }
    return deriveFallback(rec, today);
  }

   * 查找共享 schema：浏览器用 window.CRM_SCHEMA；Node 下依次尝试全局与 require('./schema.js')。
   * 找不到也不影响导出（使用内置派生）。
   */
  function resolveSchema() {
    if (root && root.CRM_SCHEMA && typeof root.CRM_SCHEMA.derive === 'function') {
      return root.CRM_SCHEMA;
    }
    if (typeof module === 'object' && module.exports && typeof require === 'function') {
      try {
        var loaded = require('./schema.js');
        if (loaded && typeof loaded.derive === 'function') { return loaded; }
      } catch (err) { /* 单文件环境：没有独立 schema 模块 */ }
    }
    return null;
  }

  function resolveFilename(name) {
    var fallback = '客户跟进台账_' + nowStamp() + '.xlsx';
    if (name === null || name === undefined) { return fallback; }
    var text = String(name).trim();
    if (!text) { return fallback; }
    /* 只接受文件名：去掉路径字符，避免误写目录 */
    text = text.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
    if (!/\.xlsx$/i.test(text)) { text += '.xlsx'; }
    return text;
  }

  function resolveToday(value) {
    if (typeof value === 'string' && isValidISODate(value)) { return value; }
    return todayISO();
  }

  /**
   * 导出客户台账。
   * @param {Array} records 客户记录数组
   * @param {Object} [opts] { filename?, today: 'YYYY-MM-DD', title? }
   * @returns {{ filename: string, bytes: Uint8Array }}
   */
  function exportCustomers(records, opts) {
    opts = opts && typeof opts === 'object' ? opts : {};
    var list = Array.isArray(records) ? records : [];
    var today = resolveToday(opts.today);
    var schema = resolveSchema();
    var derived = list.map(function (record) { return deriveRecord(record, today, schema); });

    var totalRows = [];
    var detailRows = [];
    var seq = 1;

    derived.forEach(function (item, index) {
      var last3 = Array.isArray(item.last3) ? item.last3 : [];
      var f0 = last3[0] || null;
      var f1 = last3[1] || null;
      var f2 = last3[2] || null;
      totalRows.push([
        index + 1,
        asText(item.firstInquiryAt),
        asText(item.customerName),
        asText(item.email),
        asText(item.phone),
        asText(item.address),
        asText(item.product),
        asText(item.productModel),
        asText(item.country),
        asText(item.companyName),
        asText(item.mainBusiness),
        asText(item.foundedAt),
        asText(item.teamSize),
        asText(item.annualRevenue),
        asText(item.followupStatus),
        asText(item.dealStatus),
        asText(item.coreReason),
        item.daysSince === null || item.daysSince === undefined ? '' : Number(item.daysSince),
        f0 ? f0.date : '',
        f0 ? f0.note : '',
        f1 ? f1.date : '',
        f1 ? f1.note : '',
        f2 ? f2.date : '',
        f2 ? f2.note : ''
      ]);

      last3.forEach(function (fu) {
        detailRows.push([
          seq,
          asText(item.firstInquiryAt),
          asText(item.customerName),
          asText(item.email),
          asText(item.phone),
          asText(item.companyName),
          asText(item.mainBusiness),
          asText(item.country),
          fu.date,
          fu.daysAgo === null || fu.daysAgo === undefined ? '' : Number(fu.daysAgo),
          fu.note || '',
          asText(item.followupStatus),
          asText(item.dealStatus)
        ]);
        seq += 1;
      });
    });

    var sheets = [
      {
        name: '客户总表',
        columns: TOTAL_COLUMNS,
        rows: totalRows,
        freeze: { rows: 1 },
        autoFilter: true
      },
      {
        name: '跟进明细',
        columns: DETAIL_COLUMNS,
        rows: detailRows,
        freeze: { rows: 1 },
        autoFilter: true
      }
    ];

    var bytes = buildWorkbook(sheets, { title: opts.title || '客户跟进台账' });
    return { filename: resolveFilename(opts.filename), bytes: bytes };
  }

  /* ================================================================== */
  /* 7. 浏览器下载                                                        */
  /* ================================================================== */

  /**
   * 触发浏览器下载。Node / 无 DOM 环境下抛明确错误（不静默失败）。
   * @param {Uint8Array} bytes
   * @param {string} [filename]
   */
  function download(bytes, filename) {
    var canUseBrowser = typeof document !== 'undefined' &&
      typeof Blob !== 'undefined' &&
      typeof URL !== 'undefined' &&
      typeof URL.createObjectURL === 'function';

    if (!canUseBrowser) {
      throw new Error('CrmXlsx.download 只能在浏览器中使用；Node 环境请使用 exportCustomers() 返回的 bytes 自行写文件');
    }
    if (!bytes || !bytes.length) {
      throw new Error('CrmXlsx.download 需要非空的 .xlsx 字节数据');
    }

    var name = resolveFilename(filename);
    var blob = new Blob([bytes], { type: MIME_TYPE });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.appendChild(link);
    try {
      link.click();
    } finally {
      setTimeout(function () {
        try { document.body.removeChild(link); } catch (err) { /* 已被移除 */ }
        try { URL.revokeObjectURL(url); } catch (err) { /* 忽略 */ }
      }, 1000);
    }
    return true;
  }

  /* ================================================================== */

  return {
    VERSION: VERSION,
    MIME_TYPE: MIME_TYPE,
    buildWorkbook: buildWorkbook,
    exportCustomers: exportCustomers,
    download: download
  };
});

        dealStatus: item.dealStatus,
        coreReason: item.coreReason,
        followups: (item.followups || []).map(function (f) {
          return { date: ago(f.date), note: f.note };
        }),
        createdAt: new Date(Date.now() - Math.abs(item.firstInquiryAt) * 86400000).toISOString(),
        updatedAt: new Date(Date.now() - Math.abs((item.followups && item.followups[0] ? item.followups[0].date : 1)) * 86400000).toISOString()
      }, schema.todayISO());
      return rec;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 2. 持久化                                                            */
  /* ------------------------------------------------------------------ */

  function emptyPayload() {
    return {
      version: PAYLOAD_VERSION,
      savedAt: schema.nowISO(),
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
      customers: [],
      products: []
    };
  }

  function normalizeProduct(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var name = String(raw.name || raw.product || raw.productName || '').trim().slice(0, 120);
    var model = String(raw.model || raw.productModel || '').trim().slice(0, 80);
    if (!name) return null;
    return {
      id: String(raw.id || '').trim() || schema.uid('p_'),
      name: name,
      model: model,
      createdAt: String(raw.createdAt || '').trim() || schema.nowISO()
    };
  }

  function defaultProducts() {
    return schema.DEFAULT_PRODUCTS.map(function (item) {
      return normalizeProduct({ name: item.name, model: item.model });
    });
  }

  function normalizePayload(raw) {
    var payload = emptyPayload();
    if (!raw || typeof raw !== 'object') return payload;
    if (raw.settings && typeof raw.settings === 'object') {
      payload.settings = {
        warnDays: finiteOr(raw.settings.warnDays, DEFAULT_SETTINGS.warnDays),
        staleDays: finiteOr(raw.settings.staleDays, DEFAULT_SETTINGS.staleDays),
        seeded: !!raw.settings.seeded
      };
    }
    var list = Array.isArray(raw.customers) ? raw.customers : Array.isArray(raw.records) ? raw.records : [];
    payload.customers = list.map(function (item) { return schema.normalize(item); }).filter(Boolean);
    if (Array.isArray(raw.products)) {
      payload.products = raw.products.map(normalizeProduct).filter(Boolean);
    } else {
      /* 从 v1.0 升级：没有产品库字段时写入预置产品 */
      payload.products = defaultProducts();
    }
    payload.savedAt = typeof raw.savedAt === 'string' ? raw.savedAt : schema.nowISO();
    return payload;
  }

  function finiteOr(value, fallback) {
    var n = Number(value);
    return isFinite(n) && n >= 0 ? Math.round(n) : fallback;
  }

  function load() {
    if (state) return state;
    var raw = core.storage.get(KEY, null);
    var payload = normalizePayload(raw);
    var isFirstRun = !raw;
    if (isFirstRun && payload.customers.length === 0) {
      payload.customers = buildDemoRecords();
      payload.settings.seeded = true;
      payload.products = defaultProducts();
      payload.savedAt = schema.nowISO();
      var ok = core.storage.set(KEY, payload);
      storageOk = ok;
    }
    if (!payload.products.length && payload.customers.length === 0 && !payload.settings.seeded) {
      payload.products = defaultProducts();
    }
    state = payload;
    return state;
  }

  function persist(reason) {
    state.savedAt = schema.nowISO();
    var ok = core.storage.set(KEY, state);
    storageOk = ok;
    notify(reason || 'save');
    return ok;
  }

  function notify(type, detail) {
    listeners.slice().forEach(function (fn) {
      try { fn({ type: type, detail: detail || null, state: state }); } catch (err) {
        console.warn('[CustomerCRM] store 订阅回调异常：', err);
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 3. 查询与变更                                                        */
  /* ------------------------------------------------------------------ */

  function list() {
    var payload = load();
    return payload.customers.slice().sort(function (a, b) {
      var ua = a.updatedAt || '';
      var ub = b.updatedAt || '';
      if (ua === ub) return (b.firstInquiryAt || '').localeCompare(a.firstInquiryAt || '');
      return ub.localeCompare(ua);
    });
  }

  function get(id) {
    if (!id) return null;
    var found = load().customers.filter(function (item) { return item.id === id; })[0];
    return found || null;
  }

  function add(record) {
    var payload = load();
    var rec = schema.normalize(record);
    if (!rec.id) rec.id = schema.uid('c_');
    if (get(rec.id)) rec.id = schema.uid('c_');
    rec.createdAt = schema.nowISO();
    rec.updatedAt = rec.createdAt;
    payload.customers.push(rec);
    persist('add');
    return rec;
  }

  function update(id, patch) {
    var payload = load();
    for (var i = 0; i < payload.customers.length; i += 1) {
      if (payload.customers[i].id !== id) continue;
      var merged = {};
      var base = payload.customers[i];
      Object.keys(base).forEach(function (key) { merged[key] = base[key]; });
      Object.keys(patch || {}).forEach(function (key) { merged[key] = patch[key]; });
      var next = schema.normalize(merged);
      next.id = id;
      next.createdAt = base.createdAt;
      next.updatedAt = schema.nowISO();
      payload.customers[i] = next;
      persist('update');
      return next;
    }
    return null;
  }

  function remove(id) {
    var payload = load();
    var before = payload.customers.length;
    payload.customers = payload.customers.filter(function (item) { return item.id !== id; });
    if (payload.customers.length === before) return false;
    persist('remove');
    return true;
  }

  function replaceAll(records) {
    var payload = load();
    payload.customers = (records || []).map(function (item) { return schema.normalize(item); });
    persist('replace');
    return payload.customers.length;
  }

  function clear() {
    var payload = load();
    payload.customers = [];
    payload.settings.seeded = true;
    persist('clear');
    return true;
  }

  function seedDemo(force) {
    var payload = load();
    if (!force && payload.customers.length > 0) return 0;
    payload.customers = buildDemoRecords();
    payload.settings.seeded = true;
    persist('seed');
    return payload.customers.length;
  }

  function isEmpty() {
    return load().customers.length === 0;
  }

  /* ------------------------------------------------------------------ */
  /* 3.2 产品库（咨询产品预录入：产品名称 + 型号）                          */
  /* ------------------------------------------------------------------ */

  function listProducts() {
    return load().products.slice().sort(function (a, b) {
      var byName = String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
      if (byName !== 0) return byName;
      return String(a.model || '').localeCompare(String(b.model || ''), 'zh-Hans-CN');
    });
  }

  function productNames() {
    var seen = {};
    var names = [];
    listProducts().forEach(function (item) {
      if (seen[item.name]) return;
      seen[item.name] = true;
      names.push(item.name);
    });
    return names;
  }

  function productModels(name) {
    var target = String(name || '').trim();
    if (!target) return [];
    return listProducts().filter(function (item) {
      return item.name === target && item.model;
    }).map(function (item) { return item.model; });
  }

  /** 新增产品；name+model 已存在时直接返回已有项（不重复写入） */
  function addProduct(raw) {
    var payload = load();
    var product = normalizeProduct(raw);
    if (!product) return null;
    var exists = payload.products.filter(function (item) {
      return item.name === product.name && String(item.model || '') === String(product.model || '');
    })[0];
    if (exists) return exists;
    payload.products.push(product);
    persist('product-add');
    return product;
  }

  function removeProduct(id) {
    var payload = load();
    var before = payload.products.length;
    payload.products = payload.products.filter(function (item) { return item.id !== id; });
    if (payload.products.length === before) return false;
    persist('product-remove');
    return true;
  }

  function seedProducts(force) {
    var payload = load();
    if (!force && payload.products.length) return payload.products.length;
    payload.products = defaultProducts();
    persist('product-seed');
    return payload.products.length;
  }

  /** 产品库使用热度：{ '名称|型号': 客户数 } */
  function productUsage() {
    var usage = {};
    load().customers.forEach(function (rec) {
      var key = String(rec.product || '').trim() + '|' + String(rec.productModel || '').trim();
      if (!String(rec.product || '').trim()) return;
      usage[key] = (usage[key] || 0) + 1;
    });
    return usage;
  }

  /* ------------------------------------------------------------------ */
  /* 4. 设置                                                              */
  /* ------------------------------------------------------------------ */

  function settings() {
    return JSON.parse(JSON.stringify(load().settings));
  }

  function updateSettings(patch) {
    var payload = load();
    var next = payload.settings;
    if (patch && typeof patch === 'object') {
      if (patch.warnDays !== undefined) next.warnDays = finiteOr(patch.warnDays, next.warnDays);
      if (patch.staleDays !== undefined) next.staleDays = finiteOr(patch.staleDays, next.staleDays);
      if (patch.seeded !== undefined) next.seeded = !!patch.seeded;
    }
    persist('settings');
    return settings();
  }

  /* ------------------------------------------------------------------ */
  /* 5. 派生与统计                                                        */
  /* ------------------------------------------------------------------ */

  function deriveAll() {
    var opts = settings();
    var today = schema.todayISO();
    return list().map(function (rec) {
      return schema.derive(rec, { today: today, warnDays: opts.warnDays, staleDays: opts.staleDays });
    });
  }

  function stats() {
    var opts = settings();
    var today = schema.todayISO();
    var derived = deriveAll();
    var total = derived.length;
    var deal = 0;
    var open = 0;
    var overdue = 0;
    var due = 0;
    var daysSum = 0;
    var daysCount = 0;
    var countryMap = {};
    var statusMap = {};
    var recent = [];
    var overdueList = [];

    derived.forEach(function (rec) {
      if (rec.isDeal) deal += 1;
      if (rec.isOpen) open += 1;
      if (rec.isOverdue) { overdue += 1; overdueList.push(rec); }
      if (rec.isDue) due += 1;
      if (rec.daysSince !== null && isFinite(rec.daysSince)) { daysSum += rec.daysSince; daysCount += 1; }
      var country = rec.country || '未填写';
      countryMap[country] = (countryMap[country] || 0) + 1;
      var status = rec.followupStatus || '新询盘';
      statusMap[status] = (statusMap[status] || 0) + 1;
      rec.followups.forEach(function (f) {
        recent.push({
          id: rec.id,
          customerName: rec.customerName,
          companyName: rec.companyName,
          country: rec.country,
          date: f.date,
          note: f.note,
          daysAgo: Math.max(0, schema.daysBetween(f.date, today)),
          followupStatus: rec.followupStatus,
          dealStatus: rec.dealStatus
        });
      });
    });

    recent.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    overdueList.sort(function (a, b) { return (b.daysSince || 0) - (a.daysSince || 0); });

    var byCountry = Object.keys(countryMap).map(function (name) {
      return { name: name, count: countryMap[name] };
    }).sort(function (a, b) { return b.count - a.count; });

    var byStatus = schema.FOLLOWUP_STATUS.map(function (status) {
      return { status: status, count: statusMap[status] || 0, tone: schema.statusTone(status) };
    }).filter(function (item) { return item.count > 0; });
    // 未在枚举内的历史状态兜底展示
    Object.keys(statusMap).forEach(function (status) {
      if (schema.FOLLOWUP_STATUS.indexOf(status) !== -1) return;
      byStatus.push({ status: status, count: statusMap[status], tone: schema.statusTone(status) });
    });

    return {
      total: total,
      deal: deal,
      open: open,
      overdue: overdue,
      due: due,
      dealRate: total ? deal / total : 0,
      avgDaysSince: daysCount ? Math.round(daysSum / daysCount) : null,
      byCountry: byCountry,
      byStatus: byStatus,
      recent: recent.slice(0, 8),
      overdueList: overdueList.slice(0, 6),
      warnDays: opts.warnDays,
      staleDays: opts.staleDays,
      today: today
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 备份 / 恢复                                                       */
  /* ------------------------------------------------------------------ */

  function exportJSON() {
    var payload = load();
    return JSON.stringify({
      app: 'CustomerCRM',
      version: schema.VERSION,
      exportedAt: schema.nowISO(),
      settings: payload.settings,
      products: payload.products,
      customers: payload.customers
    }, null, 2);
  }

  /**
   * 导入 JSON 备份。mode: 'merge'（默认，同 id 覆盖）| 'replace'（清空后导入）
   * 返回 { ok, imported, skipped, total, mode, products }
   */
  function importJSON(text, mode) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (err) {
      return { ok: false, error: 'JSON 解析失败：' + (err && err.message ? err.message : '格式不正确') };
    }
    var incoming = Array.isArray(parsed) ? parsed : (parsed && (parsed.customers || parsed.records)) || null;
    if (!Array.isArray(incoming)) return { ok: false, error: '文件里没有找到客户数组（customers）' };
    var payload = load();
    var importMode = mode === 'replace' ? 'replace' : 'merge';
    if (importMode === 'replace') payload.customers = [];
    var imported = 0;
    var skipped = 0;
    incoming.forEach(function (item) {
      if (!item || typeof item !== 'object') { skipped += 1; return; }
      var rec = schema.normalize(item);
      if (!rec.customerName && !rec.companyName && !rec.firstInquiryAt) { skipped += 1; return; }
      var existingIndex = -1;
      for (var i = 0; i < payload.customers.length; i += 1) {
        if (payload.customers[i].id === rec.id) { existingIndex = i; break; }
      }
      if (existingIndex === -1) payload.customers.push(rec);
      else payload.customers[existingIndex] = rec;
      imported += 1;
    });
    var importedProducts = 0;
    if (Array.isArray(parsed.products)) {
      if (importMode === 'replace') payload.products = [];
      parsed.products.forEach(function (raw) {
        var product = normalizeProduct(raw);
        if (!product) return;
        var dup = payload.products.some(function (item) {
          return item.name === product.name && String(item.model || '') === String(product.model || '');
        });
        if (dup) return;
        payload.products.push(product);
        importedProducts += 1;
      });
    }
    if (parsed.settings && importMode === 'merge') {
      payload.settings.warnDays = finiteOr(parsed.settings.warnDays, payload.settings.warnDays);
      payload.settings.staleDays = finiteOr(parsed.settings.staleDays, payload.settings.staleDays);
    }
    payload.settings.seeded = true;
    persist('import');
    return {
      ok: true,
      imported: imported,
      skipped: skipped,
      total: payload.customers.length,
      mode: importMode,
      products: importedProducts
    };
  }

  /* ------------------------------------------------------------------ */
  /* 7. 导出                                                             */
  /* ------------------------------------------------------------------ */

  root.CrmStore = {
    KEY: KEY,
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,

    init: function () {
      storageOk = core.storage.available();
      var payload = load();
      return { total: payload.customers.length, seeded: payload.settings.seeded, storageOk: storageOk };
    },
    subscribe: function (fn) {
      if (typeof fn !== 'function') return function () {};
      listeners.push(fn);
      return function () {
        var index = listeners.indexOf(fn);
        if (index !== -1) listeners.splice(index, 1);
      };
    },

    list: list,
    get: get,
    add: add,
    update: update,
    remove: remove,
    replaceAll: replaceAll,
    clear: clear,
    seedDemo: seedDemo,
    isEmpty: isEmpty,

    listProducts: listProducts,
    productNames: productNames,
    productModels: productModels,
    addProduct: addProduct,
    removeProduct: removeProduct,
    seedProducts: seedProducts,
    productUsage: productUsage,

    settings: settings,
    updateSettings: updateSettings,
    deriveAll: deriveAll,
    stats: stats,

    exportJSON: exportJSON,
    importJSON: importJSON,

    savedAt: function () { return load().savedAt; },
    storageOk: function () { return storageOk; },
    storageAvailable: function () { return core.storage.available(); },
    demoRecords: function () { return buildDemoRecords(); }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* js/app.js */
/*!
 * 客户通 CustomerCRM — js/app.js
 * 路由 / 页面渲染 / 表格 / 表单 / 智能识别 / 仪表盘 / 设置 / 帮助。
 * 依赖：js/schema.js、js/core.js、js/parser.js、js/xlsx.js、js/store.js
 */
(function (root) {
  'use strict';

  var schema = root.CRM_SCHEMA;
  var core = root.CrmCore;
  var Store = root.CrmStore;
  var esc = core.esc;
  var icon = core.icon;

  var PAYLOAD_ROUTES = ['dashboard', 'customers', 'recognize', 'settings', 'help'];

  var PAGE_META = {
    dashboard: { title: '仪表盘', crumb: '业务 / 仪表盘' },
    customers: { title: '客户台账', crumb: '业务 / 客户台账' },
    recognize: { title: '智能识别', crumb: '业务 / 智能识别' },
    settings: { title: '设置', crumb: '系统 / 设置' },
    help: { title: '使用说明', crumb: '系统 / 使用说明' }
  };

  var DEFAULT_FILTERS = { q: '', country: '', status: '', deal: '', sort: 'updated-desc' };

  var state = {
    route: 'dashboard',
    filters: Object.assign({}, DEFAULT_FILTERS),
    expanded: {},
    recog: { text: '', result: null },
    lastRecogCount: 0
  };

  var unsubscribers = [];

  /* ================================================================== */
  /* 1. 路由                                                             */
  /* ================================================================== */

  function normalizeHash(hash) {
    var value = String(hash || '').replace(/^#/, '');
    if (!value) return '#/dashboard';
    if (value.charAt(0) !== '/') value = '/' + value;
    var parts = value.split('/').filter(Boolean);
    var name = parts[0] || 'dashboard';
    if (PAYLOAD_ROUTES.indexOf(name) === -1) name = 'dashboard';
    return '#/' + name;
  }

  function parseRoute() {
    var value = normalizeHash(root.location.hash);
    var name = value.replace(/^#\//, '');
    return { name: name, hash: value };
  }

  function navigate(hash) {
    var target = normalizeHash(hash);
    if (root.location.hash === target) {
      render();
      return;
    }
    root.location.hash = target;
  }

  function getRoute() {
    return parseRoute().name;
  }

  /* ================================================================== */
  /* 2. 通用片段                                                          */
  /* ================================================================== */

  function badge(text, tone) {
    return '<span class="badge badge--' + esc(tone || 'neutral') + '">' + esc(text || '—') + '</span>';
  }

  function flagText(country) {
    var flag = country ? schema.countryFlag(country) : '';
    return flag ? '<span class="flag" aria-hidden="true">' + flag + '</span>' : '';
  }

  function ageCell(rec) {
    if (rec.daysSince === null || rec.daysSince === undefined) {
      return '<span class="age age--none">尚未跟进</span>';
    }
    var label = core.dayLabel(rec.daysSince);
    return '<span class="age age--' + esc(rec.ageTone) + '">' + esc(label) + '</span>' +
      '<span class="age-date">' + esc(schema.formatShort(rec.lastFollowupAt)) + '</span>';
  }

  function emptyState(options) {
    var opts = options || {};
    return '<div class="empty">' +
      '<div class="empty-art" aria-hidden="true">' +
        '<svg viewBox="0 0 120 90" width="120" height="90" fill="none">' +
          '<rect x="16" y="18" width="88" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"></rect>' +
          '<path d="M28 34h64M28 46h48M28 58h56" stroke="#cbd5e1" stroke-width="2.6" stroke-linecap="round"></path>' +
          '<circle cx="94" cy="66" r="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"></circle>' +
          '<path d="M88 66h12M94 60v12" stroke="#0f766e" stroke-width="2" stroke-linecap="round"></path>' +
        '</svg>' +
      '</div>' +
      '<h3 class="empty-title">' + esc(opts.title || '暂无数据') + '</h3>' +
      '<p class="empty-text">' + esc(opts.text || '') + '</p>' +
      (opts.actions ? '<div class="empty-actions">' + opts.actions + '</div>' : '') +
      '</div>';
  }

  function fieldHintFor(key) {
    var field = schema.fieldByKey(key);
    return field && field.hint ? field.hint : '';
  }

  /* ================================================================== */
  /* 3. 客户表单                                                          */
  /* ================================================================== */

  function fieldControl(field, value) {
    var id = 'f-' + field.key;
    var name = field.key;
    var common = 'id="' + id + '" name="' + name + '" class="' + (field.type === 'select' ? 'select' : 'input') + '"';

    if (field.type === 'date') {
      return '<input type="date" ' + common + ' value="' + esc(value || '') + '" required>';
    }
    if (field.type === 'email') {
      return '<input type="email" ' + common + ' value="' + esc(value || '') + '" placeholder="' + esc(field.placeholder || '') + '" autocomplete="off" spellcheck="false">';
    }
    if (field.type === 'tel') {
      return '<input type="tel" ' + common + ' value="' + esc(value || '') + '" placeholder="' + esc(field.placeholder || '') + '" autocomplete="off">';
    }
    if (field.type === 'select' && field.options === 'status') {
      return '<select ' + common + '>' + schema.FOLLOWUP_STATUS.map(function (status) {
        return '<option value="' + esc(status) + '"' + (status === (value || '新询盘') ? ' selected' : '') + '>' + esc(status) + '</option>';
      }).join('') + '</select>';
    }
    if (field.type === 'select' && field.options === 'deal') {
      return '<select ' + common + '>' + schema.DEAL_STATUS.map(function (status) {
        return '<option value="' + esc(status) + '"' + (status === (value || '未成交') ? ' selected' : '') + '>' + esc(status) + '</option>';
      }).join('') + '</select>';
    }
    if (field.type === 'select') {
      return '<input type="text" ' + common + ' list="country-options" value="' + esc(value || '') + '" placeholder="' + esc(field.placeholder || '') + '" autocomplete="off">';
    }
    if (field.type === 'textarea') {
      return '<textarea ' + common.replace('class="input"', 'class="textarea"') + ' rows="3" placeholder="' + esc(field.placeholder || '') + '">' + esc(value || '') + '</textarea>';
    }
    return '<input type="text" ' + common + ' value="' + esc(value || '') + '" placeholder="' + esc(field.placeholder || '') + '">';
  }

  function fieldHtml(field, value, full) {
    var label = esc(field.label);
    var isFull = !!(full || field.full || field.type === 'textarea');
    return '<div class="field' + (isFull ? ' field--full' : '') + '" data-field="' + field.key + '">' +
      '<label class="field-label" for="f-' + field.key + '">' + label +
      (field.required ? '<span class="req" aria-hidden="true">*</span>' : '') +
      '</label>' +
      fieldControl(field, value) +
      (field.hint ? '<p class="field-hint">' + esc(field.hint) + '</p>' : '') +
      '<p class="field-error" data-error-for="' + field.key + '" hidden></p>' +
      '</div>';
  }

  /* ---------------- 产品库：产品名称 + 型号 联动选择 ---------------- */

  function catalogNames(products) {
    var names = [];
    (products || []).forEach(function (item) {
      if (item && item.name && names.indexOf(item.name) === -1) names.push(item.name);
    });
    return names;
  }

  /**
   * 把自由文本产品匹配到产品库：精确同名 → 文本包含库内产品名 → 自定义。
   * 返回 { name, model, inCatalog }
   */
  function matchProductToCatalog(product, model) {
    var text = String(product || '').trim();
    var modelText = String(model || '').trim();
    var products = Store.listProducts();
    if (!text) return { name: '', model: modelText, inCatalog: false };
    var names = catalogNames(products);
    if (names.indexOf(text) !== -1) {
      var exactModels = products.filter(function (item) { return item.name === text; }).map(function (item) { return item.model; });
      return { name: text, model: modelText || exactModels[0] || '', inCatalog: true };
    }
    var contained = names.filter(function (name) { return text.indexOf(name) !== -1; })
      .sort(function (a, b) { return b.length - a.length; })[0];
    if (contained) {
      var finalModel = modelText;
      if (!finalModel) {
        var matched = text.match(/(\d+(?:\.\d+)?\s*(?:ml|ML|l|L|升|件套|件|pcs|PCS|kg|g|寸|cm|米))|(\d+\s*[-~—至]\s*\d+\s*(?:件套|件|人|ml|ML))/);
        if (matched) finalModel = matched[0].replace(/\s+/g, '');
      }
      return { name: contained, model: finalModel, inCatalog: true };
    }
    return { name: text, model: modelText, inCatalog: false };
  }

  function productFieldHtml(record) {
    var rec = record || {};
    var products = Store.listProducts();
    var names = catalogNames(products);
    var matched = matchProductToCatalog(rec.product || '', rec.productModel || '');
    var custom = !!matched.inCatalog ? false : !!(rec.product || '').trim();
    var selectedName = custom ? '' : matched.name;
    var models = custom ? [] : products.filter(function (item) { return item.name === selectedName; })
      .map(function (item) { return item.model; }).filter(Boolean);
    if (!custom && matched.model && models.indexOf(matched.model) === -1) models.push(matched.model);

    var nameOptions = '<option value="">请选择产品名称</option>' + names.map(function (name) {
      var modelCount = products.filter(function (item) { return item.name === name && item.model; }).length;
      return '<option value="' + esc(name) + '"' + (name === selectedName ? ' selected' : '') + '>' +
        esc(name) + (modelCount > 1 ? '（' + modelCount + ' 个型号）' : '') + '</option>';
    }).join('') +
      '<option value="__custom__"' + (custom ? ' selected' : '') + '>＋ 手动输入其他产品…</option>';

    var modelOptions = '<option value="">' + (custom ? '型号（可留空）' : '请选择型号') + '</option>' + models.map(function (model) {
      return '<option value="' + esc(model) + '"' + (model === matched.model ? ' selected' : '') + '>' + esc(model) + '</option>';
    }).join('');

    return '<div class="field field--full" data-field="product">' +
      '<label class="field-label" for="f-productName">咨询产品</label>' +
      '<div class="product-picker">' +
        '<select class="select product-picker-name" id="f-productName" name="productName" data-testid="product-name-select" aria-label="产品名称">' + nameOptions + '</select>' +
        '<select class="select product-picker-model" name="productModel" data-testid="product-model-select" aria-label="产品型号"' + (custom ? ' hidden' : '') + '>' + modelOptions + '</select>' +
        '<input type="text" class="input product-custom" name="productCustom" data-testid="product-custom-input" placeholder="产品名称，如 不锈钢保温杯" value="' + esc(custom ? (rec.product || '') : '') + '" aria-label="自定义产品名称"' + (custom ? '' : ' hidden') + '>' +
        '<input type="text" class="input product-custom" name="productModelCustom" placeholder="型号 / 规格，如 500ml" value="' + esc(custom ? (rec.productModel || '') : '') + '" aria-label="自定义产品型号"' + (custom ? '' : ' hidden') + '>' +
        '<button type="button" class="btn btn--ghost btn--sm product-add-btn" data-action="add-product-from-form"' + (custom && (rec.product || '').trim() ? '' : ' hidden') + '>' + icon('plus', 14) + ' 加入产品库</button>' +
      '</div>' +
      '<p class="field-hint">从产品库选择产品名称与型号；没有的产品可手动输入，并一键加入产品库</p>' +
      '<p class="field-error" data-error-for="product" hidden></p>' +
      '</div>';
  }

  function syncProductPicker(nameSelect) {
    if (!nameSelect) return;
    var form = document.getElementById('customer-form');
    if (!form) return;
    var modelSelect = form.querySelector('[name="productModel"]');
    var customName = form.querySelector('[name="productCustom"]');
    var customModel = form.querySelector('[name="productModelCustom"]');
    var addBtn = form.querySelector('.product-add-btn');
    var custom = nameSelect.value === '__custom__';

    if (custom) {
      if (modelSelect) { modelSelect.hidden = true; }
      if (customName) { customName.hidden = false; }
      if (customModel) { customModel.hidden = false; }
      if (addBtn) addBtn.hidden = false;
      return;
    }
    if (customName) { customName.hidden = true; customName.value = ''; }
    if (customModel) { customModel.hidden = true; customModel.value = ''; }
    if (modelSelect) {
      modelSelect.hidden = false;
      var models = Store.productModels(nameSelect.value);
      modelSelect.innerHTML = '<option value="">请选择型号</option>' + models.map(function (model) {
        return '<option value="' + esc(model) + '">' + esc(model) + '</option>';
      }).join('');
      if (models.length === 1) modelSelect.value = models[0];
    }
    if (addBtn) addBtn.hidden = true;

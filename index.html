<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="客户通 CustomerCRM —— 免部署的外贸客户管理系统。询盘一次记录，跟进状态一目了然，一键导出 Excel，一键识别询盘文本自动填表。">
  <title>客户通 CustomerCRM · 外贸客户管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2239'/%3E%3Ccircle cx='16' cy='11' r='4' fill='%232dd4bf'/%3E%3Cpath d='M8 25c0-4 3.6-6.5 8-6.5S24 21 24 25' fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='24.2' cy='9.6' r='1.6' fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#/dashboard" aria-label="客户通 CustomerCRM 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <circle cx="12" cy="8.2" r="3.4" fill="#2dd4bf"></circle>
            <path d="M5.4 19.5c0-3 3-4.9 6.6-4.9s6.6 1.9 6.6 4.9" stroke="#2dd4bf" stroke-width="1.9" stroke-linecap="round"></path>
            <circle cx="18.9" cy="6.6" r="1.5" fill="#f59e0b"></circle>
          </svg>
        </span>
        <span class="brand-text">
          <strong>客户通</strong>
          <span>CUSTOMERCRM</span>
        </span>
      </a>

      <nav class="nav" aria-label="功能导航">
        <div class="nav-section">业务</div>
        <a class="nav-item" href="#/dashboard" data-nav="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
          <span>仪表盘</span>
        </a>
        <a class="nav-item" href="#/customers" data-nav="customers">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"></path></svg>
          <span>客户台账</span>
        </a>
        <a class="nav-item" href="#/recognize" data-nav="recognize">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path><circle cx="12" cy="12" r="3.4"></circle></svg>
          <span>智能识别</span>
        </a>
        <div class="nav-section">系统</div>
        <a class="nav-item" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"></path><path d="M1 14h6M9 8h6M17 16h6"></path></svg>
          <span>设置</span>
        </a>
        <a class="nav-item" href="#/help" data-nav="help">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
          <span>使用说明</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-note">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span>本地优先 · 数据不出电脑</span>
        </div>
        <div class="sidebar-version">v1.0.0 · localStorage</div>
      </div>
    </aside>

    <div class="app-frame">
      <header class="topbar">
        <button class="icon-btn menu-toggle" type="button" data-action="toggle-sidebar" aria-label="打开导航菜单" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
        </button>
        <div class="topbar-title">
          <div class="crumbs" id="crumbs">业务 / 仪表盘</div>
          <h1 class="topbar-heading" id="page-title">仪表盘</h1>
        </div>
        <div class="topbar-actions">
          <span class="save-state" id="save-state" data-state="saved" title="数据保存在本机浏览器 localStorage">
            <span class="save-state-dot" aria-hidden="true"></span>
            <span id="save-state-text">已就绪</span>
          </span>
          <a class="icon-btn topbar-help" href="#/help" data-nav="help" aria-label="使用说明" title="使用说明">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
          </a>
          <button class="btn btn--primary btn-new-customer" type="button" data-testid="new-customer-topbar" data-action="new-customer">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span class="btn-label">新建客户</span>
          </button>
        </div>
      </header>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="view" id="view" tabindex="-1">
    <div class="view-inner" id="view-inner">
      <div class="boot-state" role="status">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p>正在加载客户台账…</p>
      </div>
    </div>
  </main>

  <div class="toast-stack" id="toast-stack" data-testid="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root" data-testid="modal-root"></div>

  <noscript>
    <div class="noscript">客户通需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。</div>
  </noscript>

  <script src="js/schema.js"></script>
  <script src="js/core.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
